<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(16, 185, 129, 0.3)" stroke-width="6"/>

  <!-- Halo Ring -->
  <circle cx="256" cy="240" r="170" fill="none" stroke="rgba(52, 211, 153, 0.15)" stroke-width="4" stroke-dasharray="12 12"/>

  <!-- Thai Decorative Flame Motif / Lotus Top -->
  <path d="M 256 90 C 275 140 310 170 310 210 C 310 240 286 260 256 260 C 226 260 202 240 202 210 C 202 170 237 140 256 90 Z" fill="url(#goldGrad)" opacity="0.9"/>

  <!-- Core Thai Consonant Glyph "ก" (Ko Kai) in Center -->
  <text x="256" y="325" font-family="'Noto Sans Thai', 'Sarabun', sans-serif" font-weight="bold" font-size="220" text-anchor="middle" fill="#ecfdf5" filter="url(#glow)">ก</text>

  <!-- Bottom Banner with Leaf Emblem -->
  <path d="M 176 390 Q 256 425 336 390 Q 256 460 176 390 Z" fill="#10b981" opacity="0.85"/>
  <circle cx="256" cy="415" r="10" fill="#fef08a"/>
</svg>